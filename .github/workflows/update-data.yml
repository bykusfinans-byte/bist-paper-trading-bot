name: BIST 4H veri güncelle

on:
  # BIST seansı 10:00-18:00 (Türkiye saati, TRT = UTC+3 sabit, DST yok)
  # yani 07:00-15:00 UTC arası, hafta içi, 10 dakikada bir çalışır.
  # Repo public olduğu için Actions dakikaları ücretsizdir; Yahoo Finance'e
  # aşırı yüklenmeyi önlemek için 10 dakika seçildi. Sık hata/rate-limit
  # görürsen "*/10" kısmını "*/20" veya "*/30" yaparak seyreltebilirsin.
  schedule:
    - cron: "*/10 7-15 * * 1-5"
  workflow_dispatch: {}

# Aynı anda iki workflow çalışması başlarsa, ikincisi birincisi bitene
# kadar kuyrukta bekler (workflow'lar arası çakışmayı önler).
concurrency:
  group: bist-data-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # rebase'in düzgün çalışması için tüm geçmiş lazım

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Bağımlılıkları kur
        run: pip install -r requirements.txt

      - name: Veriyi çek ve hesapla
        run: python scripts/fetch_data.py

      - name: data.json değiştiyse commit et ve push et
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/data.json

          if git diff --cached --quiet; then
            echo "Değişiklik yok, commit atlanıyor."
            exit 0
          fi

          git commit -m "data.json güncellendi"

          # main branch'i bu arada (ör. elle bir dosya düzenlemesiyle)
          # ilerlemiş olsa bile: önce üstüne rebase et (data.json çakışırsa
          # bizim yeni ürettiğimiz sürüm kazanır), sonra push et.
          # Başarısız olursa birkaç kez daha dener.
          n=0
          until [ "$n" -ge 5 ]
          do
            git fetch origin main
            if git rebase origin/main -X ours; then
              if git push origin HEAD:main; then
                echo "Push başarılı."
                exit 0
              fi
            else
              git rebase --abort 2>/dev/null || true
            fi
            n=$((n + 1))
            echo "Push başarısız, tekrar deneniyor ($n/5)..."
            sleep $((n * 5))
          done

          echo "Push 5 denemeden sonra başarısız oldu."
          exit 1
