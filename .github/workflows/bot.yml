name: BIST Bot

on:
  schedule:
    - cron: '5 6-15 * * 1-5'
  workflow_dispatch:

jobs:
  bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore portfolio
        uses: actions/cache/restore@v4
        id: cache-db
        with:
          path: data/portfolio.db
          key: portfolio-db-${{ github.run_id }}
          restore-keys: |
            portfolio-db-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy pyyaml

      - name: Run BIST Bot
        env:
          SENDER_EMAIL: ${{ secrets.EMAIL_SENDER }}
          SENDER_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.EMAIL_RECIPIENT }}
        run: python main.py

      - name: Save portfolio
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/portfolio.db
          key: portfolio-db-${{ github.run_id }}
