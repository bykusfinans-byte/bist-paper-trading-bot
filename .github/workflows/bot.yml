name: BIST Bot

on:
  schedule:
    - cron: '30 6 * * 1-5'    # 09:30 TR (BIST açılıştan önce - veri az olabilir)
    - cron: '0 7-15 * * 1-5'   # 10:00, 11:00, 12:00, 13:00, 14:00, 15:00, 16:00, 17:00, 18:00 TR
  workflow_dispatch:

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      # === VERITABANI CACHE (Kalıcı bakiye icin) ===
      - name: Restore portfolio database
        uses: actions/cache/restore@v4
        id: cache-db
        with:
          path: data/portfolio.db
          key: portfolio-db-${{ github.run_id }}
          restore-keys: |
            portfolio-db-
      
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install requests pandas numpy pyyaml
      
      - name: Run Bot
        env:
          SENDER_EMAIL: ${{ secrets.EMAIL_SENDER }}
          SENDER_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.EMAIL_RECIPIENT }}
        run: python main.py
      
      # === VERITABANINI KAYDET (Sonraki calistirmaya aktar) ===
      - name: Save portfolio database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/portfolio.db
          key: portfolio-db-${{ github.run_id }}
