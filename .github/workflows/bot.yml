name: BIST Paper Trading Bot

on:
  schedule:
    # Her 4 saatte bir çalıştır (UTC)
    # 07:00, 11:00, 15:00, 19:00 UTC = 10:00, 14:00, 18:00, 22:00 TR
    - cron: '0 7,11,15,19 * * 1-5'
  
  # Manuel çalıştırma için
  workflow_dispatch:

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run BIST Bot
        env:
          # E-posta ayarları (GitHub Secrets'tan alınacak)
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: |
          # Config dosyasına env değişkenlerini yaz
          python -c "
          import yaml
          with open('config/config.yaml', 'r') as f:
              config = yaml.safe_load(f)
          config['notifications']['email']['sender_email'] = '${{ secrets.EMAIL_SENDER }}'
          config['notifications']['email']['sender_password'] = '${{ secrets.EMAIL_PASSWORD }}'
          config['notifications']['email']['recipient_email'] = '${{ secrets.EMAIL_RECIPIENT }}'
          with open('config/config.yaml', 'w') as f:
              yaml.dump(config, f, allow_unicode=True)
          "
          python main.py
      
      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-reports
          path: |
            reports/
            bot.log
          retention-days: 7
