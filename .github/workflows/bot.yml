name: BIST Paper Trading Bot

on:
  schedule:
    - cron: '0 7,11,15,19 * * 1-5'
  workflow_dispatch:

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install
        run: |
          pip install yfinance pandas numpy pyyaml
      
      - name: Run Bot
        env:
          SENDER_EMAIL: ${{ secrets.EMAIL_SENDER }}
          SENDER_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.EMAIL_RECIPIENT }}
        run: python main.py
