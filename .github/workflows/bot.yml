name: BIST Bot

on:
  schedule:
    # Türkiye 09:00–18:00 (UTC 06:00–15:00)
    - cron: "0,30 6-14 * * 1-5"
    - cron: "0 15 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Portfolio veritabanını geri yükle
      - name: Restore portfolio
        uses: actions/cache/restore@v4
        with:
          path: data/portfolio.db
          key: portfolio-db
          restore-keys: |
            portfolio-db

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy pyyaml

      - name: Run BIST Bot
        env:
          SENDER_EMAIL: ${{ secrets.EMAIL_SENDER }}
          SENDER_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.EMAIL_RECIPIENT }}
        run: python main.py

      # Portfolio'yu tekrar kaydet
      - name: Save portfolio
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/portfolio.db
          key: portfolio-db-${{ github.run_id }}
