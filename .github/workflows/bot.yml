name: BIST Bot

on:
  schedule:
    - cron: '0 7 * * 1-5'    # 10:00 TR (Her gün tek sefer deneyelim önce)
    - cron: '0 11 * * 1-5'   # 14:00 TR
    - cron: '0 15 * * 1-5'   # 18:00 TR
    - cron: '0 19 * * 1-5'   # 22:00 TR
  workflow_dispatch:

jobs:
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          pip install --upgrade pip
          pip install requests pandas numpy pyyaml
      - run: python main.py
        env:
          SENDER_EMAIL: ${{ secrets.EMAIL_SENDER }}
          SENDER_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.EMAIL_RECIPIENT }}
