# BIST Paper Trading Bot - Konfigürasyon

# Takip edilecek hisseler (.IS uzantısı otomatik eklenir)
watchlist:
  - THYAO
  - GARAN
  - ASELS
  - BIMAS
  - KCHOL
  - SISE
  - TUPRS
  - EKGYO
  - ISCTR
  - AKBNK
  - YKBNK
  - SAHOL
  - ARCLK
  - KOZAA
  - PGSUS
  - TCELL
  - HEKTS
  - MGROS
  - PETKM
  - TOASO

# Portföy ayarları
portfolio:
  initial_balance: 100000  # TL
  max_position_per_stock: 0.20  # Hisse başı max %20
  stop_loss_pct: 0.05  # %5 stop-loss
  take_profit_pct: 0.10  # %10 take-profit

# Teknik analiz parametreleri
indicators:
  ema_fast: 9
  ema_slow: 21
  sma_trend: 50
  adx_period: 14
  adx_threshold: 20
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9
  bb_period: 20
  bb_std: 2

# Veri ayarları
data:
  interval: "4h"
  lookback_days: 60
  volume_threshold: 0.8  # Ortalama hacmin x katı

# Bildirim ayarları
notifications:
  email:
    enabled: true
    smtp_server: "smtp.gmail.com"
    smtp_port: 587
    sender_email: ""      # Gmail adresiniz
    sender_password: ""   # Gmail App Password
    recipient_email: ""   # Raporların gideceği adres
  telegram:
    enabled: false
    bot_token: ""
    chat_id: ""

# Raporlama
reporting:
  interval_hours: 4  # Kaç saatte bir rapor gönderilsin
